spring.application.name=ChemLearn
jwt.secret=${JWT_SECRET}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chemlearn}
spring.datasource.username=${DB_USERNAME:simpi}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

#logging.level.org.hibernate.engine.internal=DEBUG
#spring.web.error.include-message=always

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.frontend.allowed-origins=${APP_FRONTEND_ALLOWED_ORIGINS:http://localhost:5173,http://103.153.254.119,https://chemlearn.com.vn}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=GMAIL
spring.mail.password=GMAIL_SMTP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# cong thanh toan
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
